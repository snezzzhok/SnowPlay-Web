name: Prepare draft macOS release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  draft:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: Scripts/package.sh
      - name: Create reviewable draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/SnowPlay-macOS.zip --draft --title "SnowPlay $GITHUB_REF_NAME" --notes-file Docs/Release-Notes.md
