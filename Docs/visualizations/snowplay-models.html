<div id="snowplay-explorer">
  <style>
    #snowplay-explorer{display:flex;flex-direction:column;gap:calc(var(--font-size-base)*1)}
    #snowplay-explorer .panels{min-width:0}
    #snowplay-explorer .model-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:calc(var(--font-size-base)*.6)}
    #snowplay-explorer .model-figure{display:flex;flex-direction:column;align-items:center;gap:calc(var(--font-size-base)*.35);width:100%;min-width:0}
    #snowplay-explorer .model-figure img{width:100%;height:100px;object-fit:contain;background:color-mix(in srgb,var(--foreground) 12%,var(--background))}
    #snowplay-explorer .inspector{display:grid;grid-template-columns:170px 1fr;align-items:center;gap:calc(var(--font-size-base)*1);margin-bottom:calc(var(--font-size-base)*1)}
    #snowplay-explorer .inspector>img{width:170px;height:145px;object-fit:contain;background:color-mix(in srgb,var(--foreground) 12%,var(--background))}
    #snowplay-explorer .inspector-copy{display:flex;flex-direction:column;gap:calc(var(--font-size-base)*.5);min-width:0}
    #snowplay-explorer .layers{display:flex;flex-wrap:wrap;gap:calc(var(--font-size-base)*.6);margin-top:calc(var(--font-size-base)*1)}
    #snowplay-explorer .layer-figure{margin:0;display:flex;flex-direction:column;gap:calc(var(--font-size-base)*.3);align-items:center;width:110px}
    #snowplay-explorer .layer-figure img{width:92px;height:80px;object-fit:contain;background:color-mix(in srgb,var(--foreground) 12%,var(--background))}
    #snowplay-explorer .layer-figure figcaption{max-width:110px;overflow-wrap:anywhere;text-align:center}
    #snowplay-explorer .all-layer-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:calc(var(--font-size-base)*.5)}
    #snowplay-explorer .all-layer-grid img{width:100%;height:78px;object-fit:contain;background:color-mix(in srgb,var(--foreground) 12%,var(--background))}
    #snowplay-explorer .all-layer-grid .model-figure{overflow-wrap:anywhere}
    #snowplay-explorer .simulation-controls{margin-bottom:calc(var(--font-size-base)*1)}
    #snowplay-explorer .simulation-stage{display:block;width:100%;height:300px;background:var(--muted)}
    #snowplay-explorer .scene-status{margin-top:calc(var(--font-size-base)*.5);min-height:calc(var(--font-size-base)*2.5)}
    #snowplay-explorer .section-gap{margin-top:calc(var(--font-size-base)*1)}
    #snowplay-explorer .asset-label{overflow-wrap:anywhere}
    @media(max-width:500px){#snowplay-explorer .model-grid{grid-template-columns:repeat(2,minmax(0,1fr))}#snowplay-explorer .all-layer-grid{grid-template-columns:repeat(2,minmax(0,1fr))}#snowplay-explorer .inspector{grid-template-columns:110px 1fr}#snowplay-explorer .inspector>img{width:110px;height:120px}#snowplay-explorer .simulation-stage{height:265px}}
  </style>
  <div class="nav nav-pills" role="tablist" aria-label="Модели и поведение SnowPlay">

    <div id="sp-models-panel" role="tabpanel" aria-labelledby="sp-models-tab">

          <h3 id="sp-selected-name"></h3>

              <label class="form-label">Состояние
                <select class="form-select" id="sp-mascot-state">

            </div>
          </div>

      </div>
      <div id="sp-model-grid" class="model-grid" aria-label="Все модели SnowPlay"></div>

    <div id="sp-behavior-panel" role="tabpanel" aria-labelledby="sp-behavior-tab" hidden>

          <select class="form-select" id="sp-scene-select">
            <option value="snow">Снег и накопление</option>
            <option value="minimize">Свернуть и восстановить окно</option>

            <option value="frost">Иней и таяние</option>

            <option value="plow">Уборка снегоуборщиком</option>
            <option value="garland">Гирлянда и колебание</option>
            <option value="tree">Ёлка и снег на ветках</option>
            <option value="delivery">Санта, парашют и подарок</option>
            <option value="gift">Открытие подарка</option>
            <option value="mascots">Покой → ходьба → сон → реакция</option>
            <option value="focus">Focus Mode</option>
          </select>
        </label>
        <button class="btn btn-primary" id="sp-play-scene" type="button">Проиграть</button>

    </div>

  <script>
  (()=>{
    const root=document.getElementById('snowplay-explorer');
    const data=JSON.parse(root.querySelector('#sp-model-data').textContent);
    const $=id=>root.querySelector('#'+id);
    const mascotNames=['mochi','puffy','bubi'];
    const stateNames={idle:'Покой',walk:'Ходьба',sleep:'Сон',reaction:'Реакция'};
    const initial=window.openai?.widgetState?.modelContent||{};
    let selected=data.models.some(m=>m.id===initial.model)?initial.model:'tree';
    let mascotState=Object.hasOwn(stateNames,initial.mascotState)?initial.mascotState:'idle';
    let chosenLayer=data.layerNames.includes(initial.layer)?initial.layer:'tree_body';
    let chosenScene='snow',frameHandle=0,mascotHandle=0,sceneTime=0;
    const reduced=matchMedia('(prefers-reduced-motion: reduce)');
    const save=()=>{if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{model:selected,mascotState,layer:chosenLayer,scene:chosenScene},privateContent:null}).catch(()=>{});};
    const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const modelButtons=new Map(),layerButtons=new Map();
    function figure(src,label){const span=document.createElement('span');span.className='model-figure';const image=document.createElement('img');image.src=src;image.alt='';const text=document.createElement('span');text.textContent=label;span.append(image,text);return span;}
    for(const m of data.models){const button=document.createElement('button');button.type='button';button.className='btn viz-tile';button.setAttribute('aria-label',m.name);button.append(figure(m.picture,m.name));button.addEventListener('click',()=>{selectModel(m.id);save();});$('sp-model-grid').append(button);modelButtons.set(m.id,button);}
    for(const name of data.layerNames){const button=document.createElement('button');button.type='button';button.className='btn viz-tile';button.append(figure(data.thumbs[name],name));button.addEventListener('click',()=>{selectLayer(name);save();});$('sp-all-layers').append(button);layerButtons.set(name,button);}
    function selectLayer(name){chosenLayer=name;$('sp-layer-picture').src=data.thumbs[name];$('sp-layer-picture').alt=name;$('sp-layer-name').textContent=name;for(const [key,button] of layerButtons)button.setAttribute('aria-pressed',String(key===name));}
    function selectModel(id){clearTimeout(mascotHandle);selected=id;const model=data.models.find(m=>m.id===id);$('sp-selected-name').textContent=model.name;$('sp-selected-size').textContent=model.size+' · '+(mascotNames.includes(id)?'16 кадров':model.layers.length+' слоёв');$('sp-selected-detail').textContent=model.detail;$('sp-selected-picture').src=mascotNames.includes(id)?data.art[id+'_'+mascotState+'_0']:model.picture;$('sp-selected-picture').alt=model.name;$('sp-mascot-controls').hidden=!mascotNames.includes(id);$('sp-mascot-state').value=mascotState;for(const [key,button] of modelButtons)button.setAttribute('aria-pressed',String(key===id));let names=model.layers;if(mascotNames.includes(id))names=Array.from({length:4},(_,i)=>id+'_'+mascotState+'_'+i);$('sp-selected-layers').innerHTML=names.map(name=>'<figure class="layer-figure"><img src="'+data.thumbs[name]+'" alt="'+escape(name)+'"><figcaption class="text-small">'+escape(name)+'</figcaption></figure>').join('');}
    $('sp-mascot-state').addEventListener('change',e=>{mascotState=e.target.value;selectModel(selected);save();});
    $('sp-play-mascot').addEventListener('click',()=>{clearTimeout(mascotHandle);if(!mascotNames.includes(selected))return;let frame=0;const id=selected,mode=mascotState;const advance=()=>{if(id!==selected||mode!==mascotState)return;$('sp-selected-picture').src=data.art[id+'_'+mode+'_'+frame];if(frame<3&&!reduced.matches){frame++;mascotHandle=setTimeout(advance,250);}};advance();});
    const images={};const ready=Promise.all(Object.entries(data.art).map(([name,src])=>new Promise(resolve=>{const image=new Image();image.onload=resolve;image.onerror=resolve;image.src=src;images[name]=image;})));
    const canvas=$('sp-simulation'),ctx=canvas.getContext('2d');let width=640,height=300;
    const durations={snow:6,minimize:2.5,close:1.1,frost:3,balls:4,plow:4,garland:1,tree:4,delivery:7,gift:2,mascots:6,focus:2};
    const descriptions={snow:'Частицы оседают на границе окна и Dock; реальное накопление постепенное.',minimize:'25% снега осыпается; 75% сохраняется и возвращается с окном за 0,4 с.',close:'30 частиц, визуальная скорость до 35%, возврат за 1,1 с. macOS продолжает работать обычно.',frost:'Ускоренный показ: рост после 20–60 с неактивности, затем таяние за 0,5 с.',balls:'Снег с Dock увеличивает комы; три кома собираются в снеговика.',plow:'Снегоуборщик проходит вдоль Dock; слой на окнах и Dock очищается за 4 с.',garland:'Провод между креплениями; короткое затухающее колебание после быстрого движения курсора.',tree:'Ёлка стоит на свободном фоне; снег появляется на ветках. Рост здесь ускорен.',delivery:'0–3 с — полёт; 3–7 с — парашют, падение и мягкая посадка одного подарка.',gift:'Двойной клик поднимает крышку; появляется новогодний таймер. В Play доступен небольшой салют.',mascots:'Ускоренный цикл Mochi: покой, ходьба, сон, реакция. В приложении показывается один персонаж.',focus:'Focus скрывает снег над активным содержимым, иней, украшения и взаимодействия.'};
    const colorProbe=document.createElement('span');colorProbe.hidden=true;colorProbe.setAttribute('aria-hidden','true');root.append(colorProbe);let palette=null;const colors=()=>{if(palette)return palette;const read=(name,fallback)=>{colorProbe.style.color='var('+name+','+fallback+')';return getComputedStyle(colorProbe).color;};palette={bg:read('--background','Canvas'),fg:read('--foreground','CanvasText'),muted:read('--muted','Canvas'),secondary:read('--secondary','Canvas'),edge:read('--border','GrayText'),soft:read('--muted-foreground','GrayText'),gold:read('--yellow','Goldenrod')};return palette;};
    function image(name,x,y,size,alpha=1){const im=images[name];if(!im?.complete||!im.naturalWidth)return;ctx.save();ctx.globalAlpha=alpha;ctx.drawImage(im,x-size/2,y-size/2,size,size);ctx.restore();}
    function object(names,x,y,size,alpha=1){for(const name of names)image(name,x,y,size,alpha);}
    const tree=['tree_shadow','tree_trunk','tree_body','ornaments','tree_lights','tree_star'];
    const snowman=['snowman_base','snowman_middle','snowman_head','snowman_details'];
    const santa=['sleigh_body','santa_bag','santa_body'];
    function circle(x,y,r,color,alpha=1){ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.restore();}
    function rounded(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke();}}
    function text(label,x,y,color,align='left'){ctx.save();ctx.font=getComputedStyle(root).font;ctx.textAlign=align;ctx.fillStyle=color;ctx.fillText(label,x,y);ctx.restore();}
    function cap(x,y,w,h,alpha=1){if(h<=0)return;ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle='#f1f7fa';ctx.beginPath();ctx.moveTo(x,y);for(let i=0;i<=16;i++){const f=i/16;ctx.lineTo(x+w*f,y-h*(.75+.2*Math.sin(i*.9)));}ctx.lineTo(x+w,y);ctx.closePath();ctx.fill();ctx.restore();}
    function render(t){sceneTime=t;const c=colors();ctx.clearRect(0,0,width,height);ctx.fillStyle=c.muted;ctx.fillRect(0,0,width,height);const w=Math.min(310,width*.58),x=width*.5-w/2,y=58,wh=122,dockW=Math.min(330,width*.64),dockX=(width-dockW)/2,dockY=height-40;const mode=chosenScene;const p=Math.min(1,t/durations[mode]);let wx=x,wy=y,ww=w,hh=wh,windowAlpha=1;
      if(mode==='minimize'){if(t<.9){const f=t/.9;wx=x+(width*.5-x)*f;wy=y+(dockY-y)*f;ww=w*(1-f*.96);hh=wh*(1-f*.96);}else if(t<1.4){windowAlpha=0;}else{const f=Math.min(1,(t-1.4)/.6);wx=x+(width*.5-x)*(1-f);wy=y+(dockY-y)*(1-f);ww=w*(.04+.96*f);hh=wh*(.04+.96*f);}}
      if(mode==='close')windowAlpha=Math.max(0,1-t/.15);
      rounded(dockX,dockY,dockW,23,6,c.secondary,c.edge);for(let i=0;i<9;i++)rounded(dockX+12+i*(dockW-22)/9,dockY+7,10,10,2,c.soft);
      if(mode==='tree'){object(tree,width*.17,height-88,110);image('tree_snow',width*.17,height-88,110,p*.75);}
      if(mode==='delivery'){const sx=-50+(width+100)*Math.min(1,t/7),sy=55+Math.sin(t/7*Math.PI)*20;object(santa,sx,sy,92);if(t>=3){const f=Math.min(1,(t-3)/4),e=f*f*(3-2*f),gx=width*.84+Math.sin(t*2)*6*(1-f),gy=110+(height-195)*e;object(['gift_box','gift_lid'],gx,gy,60);image('parachute',gx,gy,60,Math.min(1,(t-3)*3)*(1-Math.max(0,(f-.85)/.15)));}}
      if(mode==='gift'){const gx=width*.17,gy=height-82;image('gift_box',gx,gy,78);image('gift_lid',gx,gy-Math.min(8,t*16),78,Math.max(0,1-t/2));text('До Нового года',gx,gy-56,c.fg,'center');if(t>.2){for(let i=0;i<18;i++){const a=i/18*Math.PI*2;circle(gx+Math.cos(a)*35*p,gy-30+Math.sin(a)*24*p,1.3,c.gold,Math.max(0,1-p));}}}
      if(mode==='mascots'){const index=Math.min(3,Math.floor(t/1.5)),phase=['idle','walk','sleep','reaction'][index],frame=Math.min(3,Math.floor((t%1.5)/.375));image('mochi_'+phase+'_'+frame,width*.16+(index===1?t*3:0),height-83,80);text(stateNames[phase],width*.16,height-30,c.fg,'center');}
      if(mode==='balls'){if(t<2.7){for(let i=0;i<3;i++){const f=Math.min(1,t/2.5),radius=[16,12,8][i]*(.3+.7*f);const bx=dockX+35+i*34+(width*.15-dockX-35-i*34)*Math.max(0,(t-1.5)/1.2),by=dockY-12+(height-75-dockY+12)*Math.max(0,(t-1.5)/1.2);circle(bx,by,radius,'#f1f7fa');}}else object(snowman,width*.15,height-85,78);}
      if(mode==='garland'){const a=20,b=width-20;ctx.strokeStyle=c.soft;ctx.lineWidth=1;ctx.beginPath();for(let i=0;i<=80;i++){const f=i/80,yy=25+35*f*(1-f)+Math.sin(t*11)*Math.exp(-t*4)*4*Math.sin(Math.PI*f);if(i===0)ctx.moveTo(a,yy);else ctx.lineTo(a+(b-a)*f,yy);}ctx.stroke();for(let i=0;i<Math.floor((b-a)/20);i++){const f=i/((b-a)/20),yy=25+35*f*(1-f)+Math.sin(t*11)*Math.exp(-t*4)*4*Math.sin(Math.PI*f);const im=images.garland_bulb;if(im?.complete)ctx.drawImage(im,43,43,7,9,a+(b-a)*f-2,yy,4,5);}}
      ctx.save();ctx.globalAlpha=windowAlpha;rounded(wx,wy,ww,hh,7,c.bg,c.edge);if(ww>80){for(let i=0;i<3;i++)circle(wx+12+i*9,wy+11,2,c.soft,.65);ctx.fillStyle=c.edge;for(let i=0;i<4;i++)ctx.fillRect(wx+18,wy+39+i*13,ww*(.48+(i%2)*.2),2);}ctx.restore();
      let snowHeight=5;if(mode==='snow')snowHeight=p*5;if(mode==='plow')snowHeight=5*(1-p);if(mode==='balls')snowHeight=5*(1-p*.75);if(mode==='focus')snowHeight=3;
      if(!['close','minimize'].includes(mode))cap(wx+3,wy,Math.max(0,ww-6),snowHeight,windowAlpha);
      if(['minimize','close'].includes(mode)&&t<.15)cap(x+3,y,w-6,5,1-t/.15);
      if(mode==='minimize'&&t>=1.4)cap(x+3,y,w-6,3.75,Math.min(1,(t-1.4)/.4));
      cap(dockX+3,dockY,dockW-6,snowHeight);
      if(mode==='frost'){let f=t<2?Math.min(1,t/1.4):Math.max(0,1-(t-2)/.5);ctx.strokeStyle='#d6eaf2';ctx.globalAlpha=f*.6;ctx.lineWidth=1;for(const side of [-1,1]){const fx=side<0?x-3:x+w+3;for(let i=0;i<5;i++){const yy=y+32+i*6*f;ctx.beginPath();ctx.moveTo(fx,yy);ctx.lineTo(fx+side*5*f,yy-5*f);ctx.stroke();}}ctx.globalAlpha=1;}
      let scale=1;if(mode==='close'){scale=t<.15?1-.65*t/.15:t<.4?.35:t<.75?.35+.65*((t-.4)/.35):1;for(let i=0;i<30;i++){const f=i/29,bx=x+w*f+(f-.5)*t*45,by=y-18*t+35*t*t;circle(bx,by,1+(i%3)*.25,'#f1f7fa',Math.max(0,1-t/1.1));}}
      if(mode==='minimize'&&t<1.1)for(let i=0;i<12;i++)circle(x+w*i/12+(i-6)*t*2,y-22*t+45*t*t,1.3,'#f1f7fa',Math.max(0,1-t/1.1));
      for(let i=0;i<38;i++){const fx=(i*71.39+t*2)%width,fy=(i*39.7+t*(13+i%7)*scale)%height;const active=fx>=wx&&fx<=wx+ww&&fy>=wy&&fy<=wy+hh;if(mode==='focus'&&active)continue;circle(fx,fy,.7+(i%4)*.18,'#f1f7fa',active?.2:.6);}
      if(mode==='plow')object(['plow_body','plow_wheels'],-45+(width+90)*p,dockY-24,82);
    }
    function fit(){const bounds=canvas.getBoundingClientRect();if(bounds.width<=0)return;width=bounds.width;height=bounds.height;const ratio=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(width*ratio);canvas.height=Math.round(height*ratio);ctx.setTransform(ratio,0,0,ratio,0,0);render(sceneTime);}
    const sceneSelect=$('sp-scene-select');
    function chooseScene(name){if(!Object.hasOwn(durations,name))name='snow';cancelAnimationFrame(frameHandle);chosenScene=name;sceneSelect.value=name;$('sp-scene-status').textContent=descriptions[name];render(0);}
    sceneSelect.addEventListener('change',e=>{chooseScene(e.target.value);save();});
    $('sp-play-scene').addEventListener('click',()=>{cancelAnimationFrame(frameHandle);save();const duration=durations[chosenScene];if(reduced.matches){render(duration);return;}const start=performance.now();function advance(now){const t=Math.min(duration,(now-start)/1000);render(t);if(t<duration)frameHandle=requestAnimationFrame(advance);}frameHandle=requestAnimationFrame(advance);});
    for(const tab of root.querySelectorAll('[role="tab"]'))tab.addEventListener('click',()=>{requestAnimationFrame(fit);});
    new ResizeObserver(fit).observe(canvas);
    new MutationObserver(()=>{palette=null;render(sceneTime);}).observe(document.documentElement,{attributes:true,attributeFilter:['class','style','data-theme']});
    window.addEventListener('openai:set_globals',event=>{const saved=event.detail?.globals?.widgetState?.modelContent;if(!saved)return;if(data.models.some(m=>m.id===saved.model)){mascotState=Object.hasOwn(stateNames,saved.mascotState)?saved.mascotState:'idle';selectModel(saved.model);}if(data.layerNames.includes(saved.layer))selectLayer(saved.layer);if(Object.hasOwn(durations,saved.scene))chooseScene(saved.scene);});
    selectModel(selected);selectLayer(chosenLayer);chooseScene(Object.hasOwn(durations,initial.scene)?initial.scene:'snow');ready.then(fit);
  })();
  </script>
