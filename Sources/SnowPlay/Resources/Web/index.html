<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>SnowPlay · Living Winter</title><link href="/style.css" rel="stylesheet"/><script defer="" src="/app.js"></script></head><body><main class="control living-control"><header><a class="brand" href="/"><img alt="" src="/assets/snowflake_icon"/>SnowPlay </a><span id="connection" role="status">Connecting…</span><button disabled="" id="pause">Pause</button></header><h1 class="sr-only">Your winter desktop</h1><div aria-live="polite" id="message" role="status"></div><div class="editor" hidden="" id="editor"><span id="editor-help"></span><button data-action="done">Done</button></div><div class="notice" hidden="" id="restricted"><span id="restricted-text"></span><button data-action="play">Enable Play</button></div><nav aria-label="Winter controls" class="living-tabs" role="tablist"><button aria-controls="snow" aria-selected="true" data-tab="snow" id="tab-snow" role="tab">Snow</button><button aria-controls="tree" aria-selected="false" data-tab="tree" id="tab-tree" role="tab">Tree</button><button aria-controls="snowman" aria-selected="false" data-tab="snowman" id="tab-snowman" role="tab">Snowman</button><button aria-controls="duel" aria-selected="false" data-tab="duel" id="tab-duel" role="tab">Duel</button><button aria-controls="garlands" aria-selected="false" data-tab="garlands" id="tab-garlands" role="tab">Lights</button></nav><div class="living-panels"><section aria-labelledby="tab-snow" class="world-section" id="snow" role="tabpanel"><h2>Snowfall</h2><div class="snow-grid"><div><label class="range-row"><span>Amount<output id="intensity-value"></output></span><input id="intensity" max="1" min="0" step="0.01" type="range"/></label><label class="range-row"><span>Speed<output id="snowSpeed-value"></output></span><input id="snowSpeed" max="2.5" min="0.25" step="0.05" type="range"/></label></div><div class="direction"><div class="direction-heading"><h2>Direction</h2><output id="windAngle-value">Down</output></div>
<div aria-label="Snow direction" aria-valuemax="90" aria-valuemin="-90" aria-valuenow="0" aria-valuetext="Down" class="wind-control" id="wind-control" role="slider" tabindex="0">
<svg aria-hidden="true" id="wind-scene" viewbox="0 0 360 225"><defs><lineargradient id="glass" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#d3f0ee" stop-opacity=".8"></stop><stop offset="1" stop-color="#dce9f7" stop-opacity=".15"></stop></lineargradient></defs><g class="hologram"><path class="glass-face" d="M84 80 200 28 282 75 166 130Z"></path><path class="glass-face faint" d="M84 80 166 130 166 172 84 122Z"></path><path class="glass-face faint" d="M166 130 282 75 282 117 166 172Z"></path><path class="glass-grid" d="m112 67 83 48m-54-61 82 48m6-58L113 96m146-35-115 54M84 101l82 50 116-55"></path></g><path class="direction-arc" d="M65 60 A115 115 0 0 0 295 60"></path><circle class="direction-origin" cx="180" cy="60" r="4"></circle><line id="wind-arrow" x1="180" x2="180" y1="60" y2="175"></line><path d="M174 163 180 175 186 163" id="wind-head"></path><circle cx="180" cy="175" id="wind-handle" r="12"></circle><circle cx="180" cy="175" id="wind-dot" r="3"></circle><text x="42" y="48">Left</text><text x="287" y="48">Right</text><text text-anchor="middle" x="180" y="211">Down</text></svg></div>
<input aria-hidden="true" class="sr-only" id="windAngle" max="90" min="-90" step="1" tabindex="-1" type="range"/></div></div><label class="toggle">Window snow<input id="windowSnow" type="checkbox"/></label><div class="quick-actions"><div class="action-card"><button class="action-main" data-action="clean"><img alt="Snowplow" src="/assets/snowplow_complete"/><span>Snowplow</span></button></div><div class="action-card"><button class="action-main" data-action="drop-gift"><img alt="Parachute gift" src="/assets/gift_parachute"/><span>Gift</span></button></div></div><div class="extra-actions"><button data-action="shake-windows">Shake windows</button><button class="text-button" data-action="delivery">Call Santa</button></div><div aria-label="Scene mode" class="mode-row"><button data-action="focus">Focus</button><button data-action="balanced">Balanced</button><button data-action="play">Play</button></div></section><section aria-labelledby="tab-tree" class="world-section" hidden="" id="tree" role="tabpanel"><h2>Your tree</h2><p class="hint">Choose a spot. We’ll deliver your tree.</p><div class="tree-overview"><img alt="Christmas tree" id="tree-preview" src="/assets/tree_bare"/><div><button class="primary" data-action="tree"><span id="tree-label">Place tree</span></button><button data-action="tree-gifts">Add gifts</button><button class="text-button" data-action="remove-tree" id="remove-tree">Remove tree</button></div></div><div class="tree-choices"><label class="choice"><span>Size</span><select id="treeSize"><option value="small">Small</option><option value="medium">Medium</option><option value="large">Large</option></select></label><label class="choice"><span>Lights</span><select id="treeGarland"><option value="none">None</option><option value="multi">Colorful</option><option value="warm">Warm</option><option value="ice">Ice</option></select></label><label class="choice"><span>Star</span><select id="treeStar"><option value="none">None</option><option value="gold">Gold</option><option value="ice">Ice</option><option value="ruby">Ruby</option></select></label><label class="choice"><span>Baubles</span><select id="treeBalls"><option value="none">None</option><option value="red">Red</option><option value="gold">Gold</option><option value="ice">Ice</option></select></label></div><h3>Ornaments</h3><div class="tree-choices"><label class="choice"><span>Left</span><select id="treeToy1"><option value="none">None</option><option value="bauble">Bauble</option><option value="candy">Candy</option><option value="flake">Snowflake</option></select></label><label class="choice"><span>Middle</span><select id="treeToy2"><option value="none">None</option><option value="bauble">Bauble</option><option value="candy">Candy</option><option value="flake">Snowflake</option></select></label><label class="choice"><span>Right</span><select id="treeToy3"><option value="none">None</option><option value="bauble">Bauble</option><option value="candy">Candy</option><option value="flake">Snowflake</option></select></label></div><div class="extra-actions"><button data-action="ornaments">Move ornaments</button></div></section><section aria-labelledby="tab-snowman" class="world-section" hidden="" id="snowman" role="tabpanel"><h2>Build a snowman</h2><p class="hint" id="sculpt-progress" role="status"></p><p class="hint">Drag the shovel through the snow. Roll three balls.</p><div class="cast-row"><img alt="Snowman" src="/assets/snowman_complete"/><img alt="Yeti" src="/assets/yeti_head"/></div><div class="extra-actions"><button class="primary" data-action="snowballs">Build a snowman</button><button data-action="remove-snowman">Snowball hit</button><button data-action="snowball-play">Roll &amp; throw</button><button class="text-button" data-action="move-snowmen">Move snowmen</button></div><h3>Yeti</h3><div class="button-grid"><button data-action="yeti-surprise">Surprise</button><button data-action="yeti-dodge">Dodge</button><button data-action="feed-yeti">Feed</button></div><p class="activity-status" id="yeti-status" role="status"></p><button class="text-button" data-action="cancel-story" id="stop-story">Stop</button></section><section aria-labelledby="tab-duel" class="world-section" hidden="" id="duel" role="tabpanel"><h2>Snow duel</h2><p class="hint">Aim with your cursor. Click to throw. 5 seconds per turn.</p><button class="primary" data-action="start-duel">Start duel</button><div hidden="" id="duel-controls"><div class="health-row"><label>You<progress id="player-hp" max="5" value="5"></progress></label><label>Yeti<progress id="yeti-hp" max="5" value="5"></progress></label></div><p id="duel-status" role="status"></p><div class="extra-actions"><button data-action="exit-duel">End duel</button></div></div></section><section aria-labelledby="tab-garlands" class="world-section" hidden="" id="garlands" role="tabpanel"><h2>Lights</h2><div class="bulb-preview"><img alt="" src="/assets/fairy_bulb_red"/><img alt="" src="/assets/fairy_bulb_green"/><img alt="" src="/assets/fairy_bulb_gold"/><img alt="" src="/assets/fairy_bulb_blue"/><img alt="" src="/assets/fairy_bulb_purple"/></div><div class="extra-actions"><button data-action="garland">Desktop</button><button data-action="garland-window">Window</button><button data-action="garland-add-anchor">Add anchor</button><button data-action="new-garland">New strand</button></div><label class="range-row"><span>Drape<output id="garlandSag-value"></output></span><input id="garlandSag" max="30" min="0" step="1" type="range"/></label><label class="choice"><span>Color</span><select id="bulbColor"><option value="pastel">Colorful</option><option value="warm">Warm</option><option value="ice">Ice</option></select></label><div class="preferences"><label class="toggle">Glow<input id="garlandLights" type="checkbox"/></label><label class="toggle">Twinkle<input id="garlandTwinkle" type="checkbox"/></label></div><label class="choice"><span>Strand</span><select id="garland-target"><option value="active">Current</option></select></label><button class="text-button" data-action="remove-garland-strand">Remove strand</button><h3>Dock hats</h3><div class="hat-row"><button data-action="hat-red"><img alt="" src="/assets/hat_knit_red"/>Red</button><button data-action="hat-green"><img alt="" src="/assets/hat_knit_green"/>Green</button><button data-action="hat-blue"><img alt="" src="/assets/hat_knit_blue"/>Blue</button><button data-action="remove-hats">Remove</button></div><button class="text-button" data-action="permission" id="permission">Enable window access</button></section></div>
</main></body></html>
